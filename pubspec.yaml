name: expenditure_tracker
description: "A Flutter app for tracking expenditure from various financial sources through SMS parsing."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  
  # Charts and Analytics
  fl_chart: ^0.69.0
  
  # Permissions and SMS
  permission_handler: ^11.3.1
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Security and Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  # Needed only for the one-shot v2 PIN migration in AuthService
  # (decrypt old AES-encrypted PIN, then rehash with PBKDF2). Safe to drop
  # once no installed base still carries a v2-format stored PIN.
  encrypt: ^5.0.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
