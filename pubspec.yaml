name: expenditure_tracker
description: "A Flutter app for tracking expenditure from various financial sources through SMS parsing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  
  # Charts and Analytics
  fl_chart: ^0.69.0
  
  # Permissions and SMS
  permission_handler: ^11.3.1
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Security and Authentication
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  
  # Navigation
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
